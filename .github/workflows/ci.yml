name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: this workflow only builds and tests.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      # Actions are pinned to full commit hashes so a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build src/Kilim/Kilim.csproj -c Release

      - name: Safety tests (real files, no UI)
        run: dotnet run --project tests/SafetyTests/SafetyTests.csproj -c Release
